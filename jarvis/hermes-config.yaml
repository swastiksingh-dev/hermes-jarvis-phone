# Hermes config for 9i — merge into ~/.hermes/config.yaml
# Points Hermes at local 9Router (Session 1). Fallback combos live in the
# 9Router dashboard (http://127.0.0.1:20128/dashboard), not here.
model:
  default: kr/claude-sonnet-4.5
  provider: custom
  base_url: http://127.0.0.1:20128/v1
  api_key: PASTE_DASHBOARD_KEY
  context_length: 64000

auxiliary:
  vision: { provider: auto, model: "", timeout: 120 }
  compression: { timeout: 120 }
  title_generation: { enabled: true, provider: auto, model: "" }
